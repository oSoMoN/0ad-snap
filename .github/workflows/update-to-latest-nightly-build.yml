name: Update to the latest nightly build

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  # Allow running manually, for testing purposes
  workflow_dispatch:

concurrency: ${{ github.workflow }}

jobs:
  nightly-build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y coreutils curl diffutils grep patch
          sudo snap install yq
      - uses: actions/checkout@v4
        with:
          ref: edge
      - name: Update to the latest nightly build
        run: ./check-and-update-nightly-build.sh
      - name: Commit updated snapcraft.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapcraft.yaml
          git commit -m "Update to the latest nightly build" && git push || true

