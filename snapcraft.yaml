name: 0ad
version: 0.0.23-alpha
summary: Real-time strategy game of ancient warfare
description: |
 0 A.D. (pronounced "zero ey-dee") is a free, open-source, cross-platform
 real-time strategy (RTS) game of ancient warfare. In short, it is a
 historically-based war/economy game that allows players to relive or rewrite
 the history of Western civilizations, focusing on the years between 500 B.C.
 and 500 A.D. The project is highly ambitious, involving state-of-the-art 3D
 graphics, detailed artwork, sound, and a flexible and powerful custom-built
 game engine.
confinement: strict
base: core18

apps:
  0ad:
    command: play0ad.launcher
    desktop: 0ad.desktop
    plugs:
      - home
      - network
      - network-bind
      - opengl
      - process-control
      - pulseaudio
      - removable-media
      - screen-inhibit-control
      - x11
  atlas:
    command: play0ad.launcher -editor
    plugs:
      - home
      - opengl
      - process-control
      - pulseaudio
      - removable-media
      - x11

parts:
  0ad-patches:
    plugin: nil
    source: patches
    override-build: |
      mkdir -p $SNAPCRAFT_PART_INSTALL/patches
      cp *.patch $SNAPCRAFT_PART_INSTALL/patches/
    override-prime: ""
  0ad-unix-build:
    after: [ 0ad-patches ]
    plugin: nil
    source: https://releases.wildfiregames.com/0ad-0.0.23-alpha-unix-build.tar.xz
    build-packages:
      - libboost-dev
      - libboost-filesystem-dev
      - libcurl4-gnutls-dev
      - libenet-dev
      - libgloox-dev
      - libicu-dev
      - libminiupnpc-dev
      - libnspr4-dev
      - libnvtt-dev
      - libogg-dev
      - libopenal-dev
      - libpng-dev
      - libsdl2-dev
      - libsodium-dev
      - libvorbis-dev
      - libwxgtk3.0-dev
      - libxcursor-dev
      - libxml2-dev
      - patch
      - pkg-config
      - python
      - zlib1g-dev
    override-build: |
      patch -d . -p1 < $SNAPCRAFT_STAGE/patches/allow-build-with-root.patch
      patch -d . -p1 < $SNAPCRAFT_STAGE/patches/use-sdl-semaphores.patch
      build/workspaces/update-workspaces.sh --with-system-nvtt -j$SNAPCRAFT_PARALLEL_BUILD_COUNT
      make -j$SNAPCRAFT_PARALLEL_BUILD_COUNT config=release -C build/workspaces/gcc
      P=binaries/system
      mkdir -p $SNAPCRAFT_PART_INSTALL/$P
      cp $P/pyrogenesis $P/ActorEditor $P/libAtlasUI.so $P/libCollada.so $P/libmozjs38-ps-release.so $P/readme.txt $SNAPCRAFT_PART_INSTALL/$P/
      P=binaries/data/l10n
      mkdir -p $SNAPCRAFT_PART_INSTALL/$P
      cp $P/*.po $SNAPCRAFT_PART_INSTALL/$P/
      cp build/resources/0ad.desktop $SNAPCRAFT_PART_INSTALL/
      sed -i -e "s#Icon=0ad#Icon=/icon.png#" $SNAPCRAFT_PART_INSTALL/0ad.desktop
  0ad-unix-data:
    plugin: dump
    source: https://releases.wildfiregames.com/0ad-0.0.23-alpha-unix-data.tar.xz
    organize:
      config: binaries/data/config
      mods: binaries/data/mods
      tools: binaries/data/tools
  0ad-launcher:
    plugin: dump
    source: .
    build-attributes: [ no-system-libraries ]
    prime:
      - etc/fonts/
      - lib/
      - usr/lib/
      - usr/share/fonts/
      - usr/share/themes/
      - usr/share/X11/
      - play0ad.launcher
      - icon.png
    stage-packages:
      - libboost-filesystem1.65.1
      - libboost-system1.65.1
      - libcurl3-gnutls
      - libenet7
      - libgl1-mesa-glx
      - libgloox15
      - libicu60
      - libminiupnpc10
      - libnspr4
      - libnvtt2
      - libopenal1
      - libpng16-16
      - libsdl2-2.0-0
      - libsodium23
      - libvorbisfile3
      - libwxbase3.0-0v5
      - libwxgtk3.0-0v5
      - libx11-6
      - libxcursor1
      - libxml2
      - locales-all
